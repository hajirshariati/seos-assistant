name: evals

# Gate eval regressions before deploy (audit #8). Runs the full offline eval
# suite (scripts/run-evals.mjs) on every push and PR. Env-gated and known-failing
# suites are excluded by the runner; everything else must stay green.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real Postgres (with pgvector) for the database-backed suite
    # (scripts/eval-db.mjs): migrations apply from scratch, then the store
    # isolation, sync and health checks run against it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seos_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The eval modules import server code that transitively imports the Prisma
      # client, so it must be generated first. (No DB connection needed for
      # `generate`; the offline evals never touch the database.)
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seos_test

      - name: Lint
        run: npm run lint

      - name: Run offline eval suite
        run: npm run eval:ci
