client_id = "0448b3c2fd7ca4393b467d01ced74cd4"
name = "AVA"
application_url = "https://hajirai-app-production.up.railway.app"
embedded = true
# The chat widget (extensions/) for both apps; AVA's Shopify Analytics events
# (extensions-aetrex/) for this app only — their names start with its handle.
extension_directories = ["extensions/*", "extensions-aetrex/*"]

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  # Chat-attribution: tags chat-driven orders and feeds the conversion
  # KPIs on Analytics/Home. Without this subscription those metrics
  # stay at zero on the Aetrex install (drifted from the default toml).
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [webhooks.privacy_compliance]
  customer_deletion_url = "/webhooks/customers/redact"
  customer_data_request_url = "/webhooks/customers/data_request"
  shop_deletion_url = "/webhooks/shop/redact"

[access_scopes]
# write_orders: the orders/create handler runs tagsAdd on attributed orders.
# read_all_orders (not yet here): without it the Admin API shows only the
# last 60 days of a customer's orders, so the chat says older orders aren't
# visible. Shopify refuses a version that declares it before the request is
# approved ("scopes: read_all_orders"): request it in the Dev Dashboard (the
# app → Access requests → Read all orders), then add ",read_all_orders" after
# read_orders below and deploy; the store approves the new scope on its next
# open of the app.
scopes = "read_customers,read_metaobjects,read_orders,read_products,write_orders,read_content,read_legal_policies,read_reports,read_themes"

[auth]
redirect_urls = [
  "https://hajirai-app-production.up.railway.app/auth/callback",
  "https://hajirai-app-production.up.railway.app/auth/shopify/callback",
  "https://hajirai-app-production.up.railway.app/api/auth/callback"
]

[app_proxy]
url = "https://hajirai-app-production.up.railway.app"
subpath = "hajirai"
prefix = "apps"
